<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mosque Athan — Kontrol</title>
    <style>
        /* No <canvas> of our own: ComposeViewport(document.body) creates and sizes one
           itself, and a stray empty canvas competes with it for the body's height. The
           ground colour matches the theme so there is no white flash before it paints. */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0B0B0F; }
        body { overflow: hidden; }
    </style>
</head>
<body>
<script src="mosqueathan.js"></script>
</body>
</html>
