# This is a separate file because build-logic is an included build, and an included build does not
# read the root's gradle.properties: without these, AGP 9 registers its own `kotlin` extension
# while the precompiled convention plugins are compiled, and applying
# `org.jetbrains.kotlin.multiplatform` fails with "Cannot add extension with name 'kotlin'".
# Remove both once stage 2 has migrated the convention plugins.
android.builtInKotlin=false
android.newDsl=false
